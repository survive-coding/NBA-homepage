name: ESPN fetch
on:
  workflow_dispatch:
    inputs:
      from_day:
        description: "First day (YYYY-MM-DD)"
        required: true
      to_day:
        description: "Last day (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: espn-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch finished games
        run: python espn_fetch.py --from "${{ inputs.from_day }}" --to "${{ inputs.to_day }}"
      - name: Rebuild player index
        if: always()
        run: python build_players.py
      - name: Score consolation bracket
        if: always()
        run: |
          if [ -f data/consolation_input.json ]; then python consolation.py; else echo "No data/consolation_input.json yet, skipping"; fi
      - name: Commit new data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/nba
          if [ -f data/consolation.json ]; then git add data/consolation.json; fi
          git diff --cached --quiet || git commit -m "NBA data ${{ inputs.from_day }}..${{ inputs.to_day }}"
          git push
