<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c120b">
<title>Sala de trofeos</title>
<style>
:root{--bg:#1c120b;--panel:#2b1b11;--card:#3a2517;--line:#5a3d28;--tx:#efe3d0;--mu:#b39a7e;--gold:#d4af37;--gl:#f0d27a;--gd:#8f6f1c;--silver:#c9c5bc;--bronze:#b87333;--up:#8fc27a;--dn:#d98a76}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh;
 background:radial-gradient(ellipse at 50% -10%,#4a2f1c 0,transparent 60%),repeating-linear-gradient(90deg,#1c120b 0 38px,#1f140c 38px 40px);
 padding-bottom:env(safe-area-inset-bottom)}
header{text-align:center;padding:calc(22px + env(safe-area-inset-top)) 16px 12px}
h1{margin:0;font-size:1.9rem;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(180deg,var(--gl),var(--gold) 55%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
header .mu{font-style:italic}
.mu{color:var(--mu)}.gold{color:var(--gold)}
.tabs{display:flex;justify-content:center;gap:6px;max-width:900px;margin:0 auto;padding:0 12px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.tab{flex:1;max-width:130px;padding:10px 0 8px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:#24160d;color:var(--mu);cursor:pointer;display:flex;justify-content:center}
.tab svg{width:28px;height:28px}
.tab[aria-selected=true]{background:var(--panel);color:var(--gold);box-shadow:inset 0 3px 0 var(--gold);border-color:var(--gd)}
main{max-width:900px;margin:0 auto;padding:16px;background:var(--panel);border:1px solid var(--gd);border-radius:0 0 14px 14px;min-height:60vh}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 12px;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
h2 svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 16px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #5a3d2866}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.plq{text-align:center;padding:14px 10px;border:1px solid var(--gd);border-radius:10px;background:linear-gradient(180deg,#46301f,var(--card))}
.plq .yr{color:var(--mu);letter-spacing:.15em}.plq svg{width:44px;height:44px;color:var(--gold);margin:4px 0}
.plq .champ{color:var(--gl);font-size:1.15rem;font-weight:bold}
.hall{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hall svg{width:18px;height:18px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--gd);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.r1{color:var(--gold);font-weight:bold}.r2{color:var(--silver);font-weight:bold}.r3{color:var(--bronze);font-weight:bold}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--gd),var(--gl));min-width:2px}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}
.badge{font-size:.7rem;padding:2px 8px;border-radius:99px;border:1px solid var(--gd);color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
button,select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--gd);background:#24160d;color:var(--tx)}
button{cursor:pointer;color:var(--gold)}
[hidden]{display:none!important}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:14px 16px 24px;font-style:italic}
</style>
</head>
<body>
<header><h1 id="t">Sala de trofeos</h1><div class="mu" id="s"></div></header>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="app"><p class="mu">Cargando…</p></main>
<footer>Datos mantenidos manualmente por el comisionado.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={
 trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/><path d="M14 14.7V17c0 .6.5 1 1 1.2 1.1.6 2 2 2 3.8"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
 podium:'<rect x="3" y="12" width="5" height="9"/><rect x="9.5" y="4" width="5" height="17"/><rect x="16" y="15" width="5" height="6"/>',
 swap:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
 vote:'<path d="m9 12 2 2 4-4"/><path d="M5 7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12H5V7Z"/><path d="M22 19H2"/>'
};
const ico=(n,c='')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const TABS=[['palmares','trophy','Palmarés'],['clasificacion','podium','Clasificación'],['transacciones','swap','Transacciones'],['votaciones','vote','Votaciones']];

fetch('manual.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(render)
 .catch(e=>{$('#app').innerHTML='<div class="card">No se pudo cargar manual.json ('+esc(e.message)+'). Si abres el archivo en local, usa un servidor: <code>python -m http.server</code>.</div>'});

function show(id){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));
  document.querySelectorAll('.pnl').forEach(p=>p.hidden=p.id!=='p-'+id);
  history.replaceState(null,'','#'+id);
}

function render(d){
  const eq=d.equipos||[],T=Object.fromEntries(eq.map(t=>[t.id,t])),nm=id=>T[id]?T[id].nombre:id;
  const L=d.liga||{};
  document.title=L.nombre||'Sala de trofeos';
  $('#t').textContent=L.nombre||'Sala de trofeos';
  $('#s').textContent=(L.descripcion||'')+(d.actualizado?' · Actualizado: '+d.actualizado:'');

  const tx=[...(d.transacciones||[])].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const cl=d.clasificaciones||{},ss=Object.keys(cl).sort(),cur=ss[ss.length-1],prv=ss[ss.length-2];
  const seasons=[...new Set(tx.map(t=>t.temporada).filter(Boolean))].sort().reverse();

  /* Palmarés */
  const pal=[...(d.palmares||[])].sort((a,b)=>String(b.temporada).localeCompare(String(a.temporada)));
  const cnt={};pal.forEach(p=>cnt[p.campeon]=(cnt[p.campeon]||0)+1);
  const hall=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="hall"><span>${esc(nm(id))}</span><span class="gold">${ico('trophy').repeat(Math.min(n,6))}${n>6?' ×'+n:''}</span></div>`).join('');
  const plq=pal.map(p=>`<div class="plq"><div class="yr">${esc(p.temporada)}</div>${ico('trophy')}<div class="champ">${esc(nm(p.campeon))}</div><div class="mu">Subcampeón · ${esc(nm(p.subcampeon))}</div>${p.notas?`<div class="mu">${esc(p.notas)}</div>`:''}</div>`).join('');
  const pPal=`<h2>${ico('trophy')}Palmarés</h2>${hall?`<div class="card"><div class="mu">Salón de campeones</div>${hall}</div>`:''}<div class="grid">${plq||'<p class="mu">Aún no hay campeones.</p>'}</div>`;

  /* Clasificación */
  let pCl='<p class="mu">Sin datos de clasificación.</p>';
  if(cur){
    const rows=cl[cur].map((id,i)=>{
      const pr=prv?cl[prv].indexOf(id)+1:0,dl=pr?pr-(i+1):null;
      const dh=dl===null?'<span class="mu">–</span>':dl>0?`<span class="up">▲ ${dl}</span>`:dl<0?`<span class="dn">▼ ${-dl}</span>`:'<span class="mu">=</span>';
      return `<tr><td class="${i<3?'r'+(i+1):''}">${i+1}</td><td>${esc(nm(id))}</td><td class="mu">${esc(T[id]?T[id].manager:'')}</td><td>${pr||'–'}</td><td>${dh}</td></tr>`;
    }).join('');
    pCl=`<p class="mu">Temporada ${esc(cur)}${prv?' frente a '+esc(prv):''}</p><div class="sc"><table><tr><th>Pos</th><th>Equipo</th><th>Manager</th><th>Antes</th><th>Cambio</th></tr>${rows}</table></div>`;
  }
  pCl=`<h2>${ico('podium')}Clasificación</h2>${pCl}`;

  /* Transacciones + por equipo */
  const txh=n=>tx.slice(0,n).map(t=>`<div class="tx"><span class="badge">${esc(String(t.tipo||'').replace(/_/g,' '))}</span> <b>${esc((t.equipos||[]).map(nm).join(' ↔ '))}</b> <span class="mu">· ${esc(t.fecha)}</span><div>${esc(t.detalle)}</div></div>`).join('')||'<p class="mu">Sin transacciones.</p>';
  const pTx=`<h2>${ico('swap')}Transacciones</h2>
   <div class="card"><div class="mu">Movimientos por equipo</div><p><select id="sel"><option value="all">Todas las temporadas</option>${seasons.map(s=>`<option>${esc(s)}</option>`).join('')}</select></p><div class="sc" id="cnt"></div></div>
   <div class="card"><div class="mu">Últimas transacciones</div><div id="txl">${txh(15)}</div>${tx.length>15?'<p><button id="more">Ver todas ('+tx.length+')</button></p>':''}</div>`;

  /* Votaciones */
  const vt=(d.votaciones||[]).map(v=>{
    const ops=v.opciones||[],tot=ops.reduce((a,o)=>a+o.votos,0)||1;
    return `<div class="card"><b>${esc(v.titulo)}</b> <span class="badge">${esc(v.estado)}</span><div class="mu">${esc(v.fecha)}${v.descripcion?' · '+esc(v.descripcion):''}</div>`
      +ops.map(o=>`<div>${esc(o.texto)} <span class="mu">${o.votos} (${Math.round(o.votos/tot*100)}%)</span><div class="bar" style="width:${o.votos/tot*100}%"></div></div>`).join('')
      +(v.resultado?`<div class="gold"><b>Resultado:</b> ${esc(v.resultado)}</div>`:'')+'</div>';
  }).join('')||'<p class="mu">Sin votaciones.</p>';
  const pVt=`<h2>${ico('vote')}Votaciones</h2>${vt}`;

  const body={palmares:pPal,clasificacion:pCl,transacciones:pTx,votaciones:pVt};
  $('#tabs').innerHTML=TABS.map(([id,ic,lb])=>`<button class="tab" role="tab" data-t="${id}" aria-label="${lb}" title="${lb}">${ico(ic)}</button>`).join('');
  $('#app').innerHTML=TABS.map(([id])=>`<div class="pnl" id="p-${id}" role="tabpanel" hidden>${body[id]}</div>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.t)};
  show(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'palmares');

  const more=$('#more');
  if(more)more.onclick=()=>{$('#txl').innerHTML=txh(tx.length);more.remove()};
  const draw=()=>{
    const s=$('#sel').value,c={};
    eq.forEach(t=>c[t.id]={n:0,tr:0});
    tx.filter(t=>s==='all'||t.temporada===s).forEach(t=>(t.equipos||[]).forEach(id=>{
      const o=c[id]||(c[id]={n:0,tr:0});o.n++;if(/traspaso/.test(t.tipo))o.tr++;
    }));
    const rows=Object.entries(c).sort((a,b)=>b[1].n-a[1].n),mx=Math.max(1,...rows.map(r=>r[1].n));
    $('#cnt').innerHTML='<table><tr><th>Equipo</th><th>Total</th><th>Traspasos</th><th style="width:35%"></th></tr>'
      +rows.map(([id,o])=>`<tr><td>${esc(nm(id))}</td><td>${o.n}</td><td>${o.tr}</td><td><div class="bar" style="width:${o.n/mx*100}%"></div></td></tr>`).join('')+'</table>';
  };
  $('#sel').onchange=draw;draw();
}
</script>
</body>
</html>
