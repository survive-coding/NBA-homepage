<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga Dynasty</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--ac:#c2410c;--bd:#e3e6ea;--up:#15803d;--dn:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1317;--card:#171c22;--tx:#e8ecf0;--mu:#8b95a1;--ac:#fb923c;--bd:#272e36;--up:#4ade80;--dn:#f87171}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:900px;margin:auto;padding:26px 16px 12px}
h1{margin:0;font-size:1.7rem}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;color:var(--tx);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:.9rem;border:1px solid var(--bd);background:var(--card)}
main{max-width:900px;margin:auto;padding:0 12px 40px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0}
h2{margin:0 0 12px;font-size:1.2rem}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;font-size:.78rem;text-transform:uppercase}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--ac);min-width:2px}
details{border-top:1px solid var(--bd);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.tx{padding:10px 0;border-bottom:1px solid var(--bd)}
.badge{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
button,select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:0 16px 24px}
</style>
</head>
<body>
<header><h1 id="t">Liga</h1><div class="mu" id="s"></div></header>
<nav>
<a href="#normas">Normas</a><a href="#palmares">Palmarés</a><a href="#clasificacion">Clasificación</a>
<a href="#transacciones">Transacciones</a><a href="#conteo">Por equipo</a><a href="#votaciones">Votaciones</a>
</nav>
<main id="app"><p class="mu">Cargando…</p></main>
<footer>Datos mantenidos manualmente por el comisionado.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('manual.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(render)
 .catch(e=>{$('#app').innerHTML='<section>No se pudo cargar manual.json ('+esc(e.message)+'). Si abres el archivo en local, usa un servidor: <code>python -m http.server</code>.</section>'});

function render(d){
  const eq=d.equipos||[],T=Object.fromEntries(eq.map(t=>[t.id,t])),nm=id=>T[id]?T[id].nombre:id;
  const L=d.liga||{};
  document.title=L.nombre||'Liga';
  $('#t').textContent=L.nombre||'Liga';
  $('#s').textContent=(L.descripcion||'')+(d.actualizado?' · Actualizado: '+d.actualizado:'');

  const tx=[...(d.transacciones||[])].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const cl=d.clasificaciones||{},ss=Object.keys(cl).sort(),cur=ss[ss.length-1],prv=ss[ss.length-2];
  const seasons=[...new Set(tx.map(t=>t.temporada).filter(Boolean))].sort().reverse();

  const normas=(d.normas||[]).map(g=>`<details><summary>${esc(g.titulo)}</summary><ul>${(g.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></details>`).join('');

  const pal=[...(d.palmares||[])].sort((a,b)=>String(b.temporada).localeCompare(String(a.temporada)))
    .map(p=>`<tr><td>${esc(p.temporada)}</td><td><b>${esc(nm(p.campeon))}</b></td><td>${esc(nm(p.subcampeon))}</td><td class="mu">${esc(p.notas||'')}</td></tr>`).join('');

  let clas='<p class="mu">Sin datos de clasificación.</p>';
  if(cur){
    const rows=cl[cur].map((id,i)=>{
      const pr=prv?cl[prv].indexOf(id)+1:0,dl=pr?pr-(i+1):null;
      const dh=dl===null?'<span class="mu">–</span>':dl>0?`<span class="up">▲ ${dl}</span>`:dl<0?`<span class="dn">▼ ${-dl}</span>`:'<span class="mu">=</span>';
      return `<tr><td>${i+1}</td><td>${esc(nm(id))}</td><td class="mu">${esc(T[id]?T[id].manager:'')}</td><td>${pr||'–'}</td><td>${dh}</td></tr>`;
    }).join('');
    clas=`<p class="mu">Temporada ${esc(cur)}${prv?' frente a '+esc(prv):''}</p><div class="sc"><table><tr><th>Pos</th><th>Equipo</th><th>Manager</th><th>Antes</th><th>Cambio</th></tr>${rows}</table></div>`;
  }

  const txh=n=>tx.slice(0,n).map(t=>`<div class="tx"><span class="badge">${esc(String(t.tipo||'').replace('_',' '))}</span> <b>${esc((t.equipos||[]).map(nm).join(' ↔ '))}</b> <span class="mu">· ${esc(t.fecha)}</span><div>${esc(t.detalle)}</div></div>`).join('')||'<p class="mu">Sin transacciones.</p>';

  const vt=(d.votaciones||[]).map(v=>{
    const ops=v.opciones||[],tot=ops.reduce((a,o)=>a+o.votos,0)||1;
    return `<div class="tx"><b>${esc(v.titulo)}</b> <span class="badge">${esc(v.estado)}</span><div class="mu">${esc(v.fecha)}${v.descripcion?' · '+esc(v.descripcion):''}</div>`
      +ops.map(o=>`<div>${esc(o.texto)} <span class="mu">${o.votos} (${Math.round(o.votos/tot*100)}%)</span><div class="bar" style="width:${o.votos/tot*100}%"></div></div>`).join('')
      +(v.resultado?`<div><b>Resultado:</b> ${esc(v.resultado)}</div>`:'')+'</div>';
  }).join('')||'<p class="mu">Sin votaciones.</p>';

  $('#app').innerHTML=`
  <section id="normas"><h2>Normas</h2>${normas||'<p class="mu">Sin normas.</p>'}</section>
  <section id="palmares"><h2>Palmarés</h2><div class="sc"><table><tr><th>Temporada</th><th>Campeón</th><th>Subcampeón</th><th>Notas</th></tr>${pal}</table></div></section>
  <section id="clasificacion"><h2>Clasificación</h2>${clas}</section>
  <section id="transacciones"><h2>Transacciones recientes</h2><div id="txl">${txh(15)}</div>${tx.length>15?'<p><button id="more">Ver todas ('+tx.length+')</button></p>':''}</section>
  <section id="conteo"><h2>Transacciones por equipo</h2><p><select id="sel"><option value="all">Todas las temporadas</option>${seasons.map(s=>`<option>${esc(s)}</option>`).join('')}</select></p><div class="sc" id="cnt"></div></section>
  <section id="votaciones"><h2>Votaciones</h2>${vt}</section>`;

  const more=$('#more');
  if(more)more.onclick=()=>{$('#txl').innerHTML=txh(tx.length);more.remove()};

  const draw=()=>{
    const s=$('#sel').value,c={};
    eq.forEach(t=>c[t.id]={n:0,tr:0});
    tx.filter(t=>s==='all'||t.temporada===s).forEach(t=>(t.equipos||[]).forEach(id=>{
      const o=c[id]||(c[id]={n:0,tr:0});o.n++;if(/traspaso/.test(t.tipo))o.tr++;
    }));
    const rows=Object.entries(c).sort((a,b)=>b[1].n-a[1].n),mx=Math.max(1,...rows.map(r=>r[1].n));
    $('#cnt').innerHTML='<table><tr><th>Equipo</th><th>Total</th><th>Traspasos</th><th style="width:35%"></th></tr>'
      +rows.map(([id,o])=>`<tr><td>${esc(nm(id))}</td><td>${o.n}</td><td>${o.tr}</td><td><div class="bar" style="width:${o.n/mx*100}%"></div></td></tr>`).join('')+'</table>';
  };
  $('#sel').onchange=draw;draw();
}
</script>
</body>
</html>
